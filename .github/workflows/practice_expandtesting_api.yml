name: Practice ExpandTesting API - Multi-Env QA Pipeline

on:
  push:
    branches:
      - main
    paths:
      - 'practice_expandtesting_api/**'

  repository_dispatch:
    types: [jenkins-trigger]

  workflow_dispatch:
    inputs:
      environment:
        description: 'Select Target Environment'
        required: true
        default: 'DIT'
        type: choice
        options: [DIT, SIT, UAT]
      test_suite:
        description: 'Select Test Suite Scope'
        required: true
        default: 'all'
        type: choice
        options: [all, integration, e2e, performance]

jobs:
  orchestrate-context:
    name: Evaluate Run Context
    runs-on: ubuntu-latest
    outputs:
      target_env: ${{ steps.determine-context.outputs.TARGET_ENV }}
      test_suite:  ${{ steps.determine-context.outputs.TEST_SUITE }}
    steps:
      - id: determine-context
        name: Parse Trigger Type and Environment Mapping
        run: |
          if [ "${{ github.event_name }}" = "repository_dispatch" ]; then
            echo "TARGET_ENV=${{ github.event.client_payload.environment }}" >> $GITHUB_OUTPUT
            echo "TEST_SUITE=${{ github.event.client_payload.test_suite }}" >> $GITHUB_OUTPUT
          elif [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            echo "TARGET_ENV=${{ github.event.inputs.environment }}" >> $GITHUB_OUTPUT
            echo "TEST_SUITE=${{ github.event.inputs.test_suite }}" >> $GITHUB_OUTPUT
          else
            echo "TARGET_ENV=DIT" >> $GITHUB_OUTPUT
            echo "TEST_SUITE=all" >> $GITHUB_OUTPUT
          fi

  execute-qa-engines:
    name: Run QA Automation
    needs: orchestrate-context
    runs-on: ubuntu-latest
    environment: ${{ needs.orchestrate-context.outputs.target_env }}
    env:
      TARGET_ENV: ${{ needs.orchestrate-context.outputs.target_env }}
      TEST_SUITE: ${{ needs.orchestrate-context.outputs.test_suite }}
      MODULE_PATH: practice_expandtesting_api

    steps:
      - name: Checkout Code Repository
        uses: actions/checkout@v4

      - name: Initialize Python Core
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'

      - name: Install Sub-Module Dependencies
        run: |
          python -m pip install --upgrade pip
          if [ -f "${{ env.MODULE_PATH }}/requirements.txt" ]; then
            pip install -r "${{ env.MODULE_PATH }}/requirements.txt"
          fi
          pip install pytest-html locust

      - name: Execute Targeted Test Matrices
        run: |
          cd ${{ env.MODULE_PATH }}
          mkdir -p output_reports
          
          if [ "${{ env.TEST_SUITE }}" = "all" ] || [ "${{ env.TEST_SUITE }}" = "integration" ]; then
            pytest tests/integration/ --html=output_reports/integration_report.html --self-contained-html
          fi
          if [ "${{ env.TEST_SUITE }}" = "all" ] || [ "${{ env.TEST_SUITE }}" = "e2e" ]; then
            pytest tests/e2e/ --html=output_reports/e2e_report.html --self-contained-html
          fi
          if [ "${{ env.TEST_SUITE }}" = "all" ] || [ "${{ env.TEST_SUITE }}" = "performance" ]; then
            locust -f performance/locustfile.py --config=performance/locust.conf --headless --html output_reports/performance_report.html
          fi
          
          # Ensure all attachment paths exist even if a test suite was skipped
          touch output_reports/integration_report.html
          touch output_reports/e2e_report.html
          touch output_reports/performance_report.html

      - name: Securely Mail Out Raw Test Reports
        if: always()
        uses: dawidd6/action-send-mail@v3
        with:
          server_address: ${{ secrets.SMTP_SERVER }}
          server_port: ${{ secrets.SMTP_PORT }}
          username: ${{ secrets.SMTP_USERNAME }}
          password: ${{ secrets.SMTP_PASSWORD }}
          subject: "[QA RUN OUTCOME] Module: practice_expandtesting_api | Env: ${{ env.TARGET_ENV }}"
          priority: high
          to: qa-distribution-list@yourcompany.com
          from: GitHub Pipeline Runner <automated-alerts@yourcompany.com>
          body: |
            Automation QA run execution completed for the module: practice_expandtesting_api.
            
            Execution Metadata:
            - Target Infrastructure Environment: ${{ env.TARGET_ENV }}
            - Selected Suite Scope: ${{ env.TEST_SUITE }}
            - Initial Pipeline Trigger Event: ${{ github.event_name }}
            
            The raw execution documents are securely bound to this email context. No metrics have been recorded on persistent cloud storage volumes.
          attachments: ${{ env.MODULE_PATH }}/output_reports/integration_report.html,${{ env.MODULE_PATH }}/output_reports/e2e_report.html,${{ env.MODULE_PATH }}/output_reports/performance_report.html
