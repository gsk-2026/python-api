name: Practice ExpandTesting API - Multi-Env QA Pipeline

on:
  push:
    branches:
      - main
    paths:
      - 'practice_expandtesting_api/**'

  repository_dispatch:
    types: [jenkins-trigger]

  workflow_dispatch:
    inputs:
      test_env:
        description: 'Select Test Environment'
        required: true
        default: 'DIT'
        type: choice
        options: [DIT, SIT, UAT]
      test_scope:
        description: 'Select Test Scope'
        required: true
        default: 'all'
        type: choice
        options: [all, integration, e2e, performance]

jobs:
  orchestrate-context:
    name: Evaluate Run Context
    runs-on: ubuntu-latest
    outputs:
      test_module: ${{ steps.determine-context.outputs.TEST_MODULE }}
      test_env: ${{ steps.determine-context.outputs.TEST_ENV }}
      test_scope: ${{ steps.determine-context.outputs.TEST_SCOPE }}
    steps:
      - id: determine-context
        name: Parse Trigger Type and Environment Mapping
        run: |
          if [ "${{ github.event_name }}" = "repository_dispatch" ]; then
            echo "TEST_MODULE=${{ github.event.client_payload.target_module }}" >> $GITHUB_OUTPUT
            echo "TEST_ENV=${{ github.event.client_payload.target_env }}" >> $GITHUB_OUTPUT
            echo "TEST_SCOPE=${{ github.event.client_payload.target_scope }}" >> $GITHUB_OUTPUT
          elif [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            echo "TEST_MODULE=practice_expandtesting_api" >> $GITHUB_OUTPUT
            echo "TEST_ENV=${{ github.event.inputs.test_env }}" >> $GITHUB_OUTPUT
            echo "TEST_SCOPE=${{ github.event.inputs.test_scope }}" >> $GITHUB_OUTPUT
          else
            echo "TEST_MODULE=practice_expandtesting_api" >> $GITHUB_OUTPUT
            echo "TEST_ENV=DIT" >> $GITHUB_OUTPUT
            echo "TEST_SCOPE=all" >> $GITHUB_OUTPUT
          fi 

  execute-qa-engines:
    name: Run QA Automation
    needs: orchestrate-context
    # Only run this job if TEST_MODULE equals practice_expandtesting_api
    if: ${{ needs.orchestrate-context.outputs.test_module == 'practice_expandtesting_api' }}
    runs-on: ubuntu-latest
    environment: ${{ needs.orchestrate-context.outputs.test_env }}
    env:
      TEST_SUITE_ENV: ${{ needs.orchestrate-context.outputs.test_env }}
      TEST_SUITE_SCOPE: ${{ needs.orchestrate-context.outputs.test_scope }}
      TEST_SUITE_MODULE: practice_expandtesting_api

    steps:
      - name: Checkout Code Repository
        uses: actions/checkout@v4

      - name: Initialize Python Core
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'

      - name: Install Sub-Module Dependencies
        run: |
          python -m pip install --upgrade pip
          if [ -f "${{ env.TEST_SUITE_MODULE }}/requirements.txt" ]; then
            pip install -r "${{ env.TEST_SUITE_MODULE }}/requirements.txt"
          fi
          pip install pytest-html locust

      - name: Execute Targeted Test Matrices
        run: |
          cd ${{ env.TEST_SUITE_MODULE }}
          mkdir -p output_reports
          
          if [ "${{ env.TEST_SUITE_SCOPE }}" = "all" ] || [ "${{ env.TEST_SUITE_SCOPE }}" = "integration" ]; then
            pytest tests/integration/ --test_env ${{ env.TEST_SUITE_ENV }} --html=output_reports/integration_report.html --self-contained-html || true
          fi
          if [ "${{ env.TEST_SUITE_SCOPE }}" = "all" ] || [ "${{ env.TEST_SUITE_SCOPE }}" = "e2e" ]; then
            pytest tests/e2e/ --test_env ${{ env.TEST_SUITE_ENV }} --html=output_reports/e2e_report.html --self-contained-html || true
          fi
          if [ "${{ env.TEST_SUITE_SCOPE }}" = "all" ] || [ "${{ env.TEST_SUITE_SCOPE }}" = "performance" ]; then
            TEST_ENV=${{ env.TEST_SUITE_ENV }} locust -f performance/locustfile.py --config=performance/locust.conf --headless -u 3 -r 1 -t 5m --html output_reports/performance_report.html || true
          fi
          
          # Ensure all attachment paths exist even if a test suite was skipped
          # touch output_reports/integration_report.html
          # touch output_reports/e2e_report.html
          # touch output_reports/performance_report.html
          
          # Compress output reports into a zip file
          zip -r qa_test_reports.zip output_reports/

      - name: Securely Mail Out Raw Test Reports
        if: always()
        uses: dawidd6/action-send-mail@v3
        with:
          server_address: ${{ secrets.SMTP_SERVER }}
          server_port: ${{ secrets.SMTP_PORT }}
          username: ${{ secrets.SMTP_USERNAME }}
          password: ${{ secrets.SMTP_PASSWORD }}
          subject: "[QA RUN OUTCOME] Module: practice_expandtesting_api | Env: ${{ env.TEST_SUITE_ENV }}"
          priority: high
          to: qa-distribution-list@yourcompany.com
          from: GitHub Pipeline Runner <automated-alerts@yourcompany.com>
          body: |
            Automation QA run execution completed for the module: practice_expandtesting_api.
            
            Execution Metadata:
            - Selected Test Environment: ${{ env.TEST_SUITE_ENV }}
            - Selected Test Scope: ${{ env.TEST_SUITE_SCOPE }}
            - Initial Pipeline Trigger Event: ${{ github.event_name }}
            
            The raw execution documents are securely bound to this email context. No metrics have been recorded on persistent cloud storage volumes.
          #attachments: ${{ env.TEST_SUITE_MODULE }}/output_reports/integration_report.html,${{ env.TEST_SUITE_MODULE }}/output_reports/e2e_report.html,${{ env.TEST_SUITE_MODULE }}/output_reports/performance_report.html
          attachments: ${{ env.TEST_SUITE_MODULE }}/qa_test_reports.zip